<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CSSLab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a1208'/%3E%3Ctext x='4' y='25' font-size='22' font-family='monospace' font-weight='900' fill='%23d63a1f'%3EC%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f0e8;
  --surface: #ede8df;
  --surface2: #e4ddd2;
  --ink: #1a1208;
  --ink2: #3d3020;
  --muted: #8a7d6b;
  --border: #d4cbbe;
  --border2: #c4b8a8;
  --accent: #d63a1f;
  --header-h: 52px;
  --tab-h: 40px;
  --status-h: 28px;
  --history-w: 280px;
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Martian Mono', monospace;
  display: flex;
  flex-direction: column;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ── HEADER ─────────────────────────────────────────── */
header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  border-bottom: 2px solid var(--ink);
  background: var(--bg);
  flex-shrink: 0;
  gap: 0.75rem;
  position: relative;
  z-index: 10;
}
.logo {
  display: flex;
  align-items: baseline;
  gap: 0.25rem;
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: -0.04em;
  flex-shrink: 0;
  user-select: none;
}
.logo-accent { color: var(--accent); }
.logo-v {
  font-size: 0.58rem;
  font-weight: 700;
  color: var(--muted);
  vertical-align: super;
  margin-left: 1px;
}
.header-center {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
  justify-content: center;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}
.divider { width: 1px; height: 20px; background: var(--border2); }

/* ── BUTTONS ─────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: 'Martian Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  padding: 0.35rem 0.7rem;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  border: 1.5px solid var(--border2);
  background: var(--surface);
  color: var(--ink2);
  white-space: nowrap;
  line-height: 1;
}
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.btn-accent:hover { background: #b52e15; border-color: #b52e15; color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface2); color: var(--ink); border-color: var(--border); }
.btn-full { width: 100%; justify-content: center; }

.icon-btn {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  cursor: pointer;
  border: 1.5px solid transparent;
  background: transparent;
  color: var(--muted);
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface2); color: var(--ink); border-color: var(--border); }
.icon-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ── WORKSPACE ───────────────────────────────────────── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  min-height: 0;
}

/* ── PANEL ───────────────────────────────────────────── */
.panel {
  display: flex;
  flex-direction: column;
  border-right: 2px solid var(--ink);
  overflow: hidden;
  min-height: 0;
}
.panel:last-child { border-right: none; }
.panel-header {
  height: var(--tab-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.75rem 0 0;
  border-bottom: 1.5px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.tabs { display: flex; gap: 2px; padding-left: 0.5rem; }
.tab {
  font-family: 'Martian Mono', monospace;
  font-size: 0.65rem;
  font-weight: 500;
  padding: 0.25rem 0.65rem;
  border-radius: 2px;
  cursor: pointer;
  color: var(--muted);
  transition: color 0.1s, background 0.1s, border-color 0.1s;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border: 1.5px solid transparent;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  user-select: none;
}
.tab.active { color: var(--ink); background: var(--bg); border-color: var(--border2); font-weight: 700; }
.tab:not(.active):hover { color: var(--ink2); background: var(--surface2); }
.tab-count { font-size: 0.58rem; color: var(--muted); font-weight: 400; }

.panel-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  padding-right: 0.25rem;
}

/* ── EDITOR ──────────────────────────────────────────── */
.editor-wrap { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.editor-pane { position: absolute; inset: 0; display: none; flex-direction: column; }
.editor-pane.active { display: flex; }
.CodeMirror {
  flex: 1;
  height: 100% !important;
  font-family: 'Martian Mono', monospace !important;
  font-size: 0.78rem !important;
  line-height: 1.7 !important;
  background: #1c1812 !important;
  color: #e8dfc8 !important;
  border: none !important;
}
.CodeMirror-scroll { height: 100% !important; }
.CodeMirror-cursor { border-left-color: var(--accent) !important; }
.CodeMirror-selected { background: rgba(214,58,31,0.2) !important; }
.CodeMirror-gutters { background: #161310 !important; border-right: 1px solid #2a2420 !important; }
.CodeMirror-linenumber { color: #4a4038 !important; }

/* ── PREVIEW ─────────────────────────────────────────── */
.preview-wrap {
  flex: 1;
  overflow: hidden;
  background: #fff;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
}
.preview-wrap.tablet, .preview-wrap.mobile { background: var(--surface2); }
iframe { width: 100%; height: 100%; border: none; }
.preview-wrap.tablet iframe { width: 768px; max-width: 100%; border-left: 1.5px solid var(--border2); border-right: 1.5px solid var(--border2); }
.preview-wrap.mobile iframe { width: 390px; max-width: 100%; border-left: 1.5px solid var(--border2); border-right: 1.5px solid var(--border2); }

/* ── STATUS BAR ──────────────────────────────────────── */
.statusbar {
  height: var(--status-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  border-top: 2px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
  flex-shrink: 0;
  font-size: 0.62rem;
  font-family: 'Martian Mono', monospace;
}
.status-left, .status-right { display: flex; align-items: center; gap: 0.75rem; }
.status-sep { color: rgba(245,240,232,0.2); }
.status-muted { color: rgba(245,240,232,0.4); }
.status-cursor { color: rgba(245,240,232,0.6); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }

/* ── DROPDOWN ────────────────────────────────────────── */
.dropdown-wrap { position: relative; }
.dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--bg);
  border: 2px solid var(--ink);
  border-radius: 4px;
  min-width: 200px;
  z-index: 200;
  overflow: hidden;
  display: none;
  box-shadow: 4px 4px 0 var(--ink);
}
.dropdown.open { display: block; }
.dropdown-section {
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  padding: 0.5rem 0.75rem 0.25rem;
}
.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.45rem 0.75rem;
  cursor: pointer;
  transition: background 0.1s;
  font-size: 0.72rem;
  border-bottom: 1px solid var(--border);
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: var(--ink); color: var(--bg); }
.badge {
  font-size: 0.58rem;
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}
.dropdown-item:hover .badge { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); border-color: transparent; }

/* ── HISTORY ─────────────────────────────────────────── */
.history-panel {
  position: fixed;
  top: var(--header-h);
  right: 0;
  bottom: var(--status-h);
  width: var(--history-w);
  background: var(--bg);
  border-left: 2px solid var(--ink);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow: -4px 0 0 var(--ink);
}
.history-panel.open { transform: translateX(0); }
.history-header {
  padding: 0.75rem 1rem;
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.history-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.history-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
.history-item {
  padding: 0.6rem 0.75rem;
  border-radius: 3px;
  border: 1.5px solid var(--border);
  margin-bottom: 0.4rem;
  cursor: pointer;
  transition: border-color 0.1s;
  background: var(--surface);
  position: relative;
}
.history-item:hover { border-color: var(--ink2); }
.history-item.current { border-color: var(--accent); }
.history-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.2rem; }
.history-time { font-size: 0.6rem; color: var(--muted); }
.history-del {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.1s, background 0.1s, color 0.1s;
  flex-shrink: 0;
}
.history-item:hover .history-del { opacity: 1; }
.history-del:hover { background: var(--accent); color: #fff; }
.history-preview { font-size: 0.65rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.68rem;
  padding: 2rem 1rem;
  line-height: 2;
}
.history-empty kbd {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  border-radius: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  font-family: 'Martian Mono', monospace;
  font-size: 0.62rem;
  color: var(--ink2);
}
.history-footer {
  padding: 0.5rem;
  border-top: 1.5px solid var(--border);
  flex-shrink: 0;
}

/* ── TOAST ───────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: calc(var(--status-h) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink);
  color: var(--bg);
  font-size: 0.7rem;
  padding: 0.45rem 1rem;
  border-radius: 3px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 500;
  white-space: nowrap;
  box-shadow: 3px 3px 0 var(--accent);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MOBILE ──────────────────────────────────────────── */
@media (max-width: 768px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .panel { border-right: none; border-bottom: 2px solid var(--ink); }
  .panel:last-child { border-bottom: none; }
  .header-center { display: none; }
  .history-panel { width: 100%; }
  .btn span { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">CSS<span class="logo-accent">Lab</span><span class="logo-v">v2</span></div>

  <div class="header-center">
    <div class="dropdown-wrap">
      <button class="btn" onclick="toggleDropdown('dd-templates')">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Templates</span>
      </button>
      <div class="dropdown" id="dd-templates">
        <div class="dropdown-section">Componentes</div>
        <div class="dropdown-item" onclick="loadTemplate('blank')">Em branco <span class="badge">base</span></div>
        <div class="dropdown-item" onclick="loadTemplate('hero')">Hero Section <span class="badge">layout</span></div>
        <div class="dropdown-item" onclick="loadTemplate('card')">Card de Produto <span class="badge">UI</span></div>
        <div class="dropdown-item" onclick="loadTemplate('form')">Formulário <span class="badge">UI</span></div>
        <div class="dropdown-item" onclick="loadTemplate('navbar')">Navbar <span class="badge">layout</span></div>
        <div class="dropdown-item" onclick="loadTemplate('grid')">Grid de Cards <span class="badge">layout</span></div>
      </div>
    </div>

    <div class="divider"></div>

    <div style="display:flex;gap:3px;">
      <button class="icon-btn active" id="vp-desktop" title="Desktop" onclick="setViewport('desktop',this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button class="icon-btn" id="vp-tablet" title="Tablet" onclick="setViewport('tablet',this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
      <button class="icon-btn" id="vp-mobile" title="Mobile" onclick="setViewport('mobile',this)">
        <svg width="11" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="header-right">
    <button class="btn btn-ghost" onclick="shareURL()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      <span>Compartilhar</span>
    </button>
    <button class="btn btn-ghost" onclick="toggleHistory()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Histórico</span>
    </button>
    <button class="btn btn-accent" onclick="exportHTML()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar
    </button>
  </div>
</header>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('html')" id="tab-html">
          HTML<span class="tab-count" id="count-html"></span>
        </div>
        <div class="tab" onclick="switchTab('css')" id="tab-css">
          CSS<span class="tab-count" id="count-css"></span>
        </div>
      </div>
      <div class="panel-actions">
        <button class="icon-btn" title="Copiar código (Ctrl+Shift+C)" onclick="copyCode()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="icon-btn" title="Salvar snapshot (Ctrl+S)" onclick="saveSnapshot()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="editor-pane active" id="pane-html"><textarea id="editor-html"></textarea></div>
      <div class="editor-pane" id="pane-css"><textarea id="editor-css"></textarea></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="tabs"><div class="tab active">Preview</div></div>
      <div class="panel-actions">
        <button class="icon-btn" title="Recarregar (Ctrl+Enter)" onclick="updatePreview()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <iframe id="preview" title="Preview"></iframe>
    </div>
  </div>
</div>

<div class="history-panel" id="history-panel">
  <div class="history-header">
    <span class="history-title">Histórico</span>
    <button class="icon-btn" onclick="closeHistory()" title="Fechar (Esc)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="history-list" id="history-list"></div>
  <div class="history-footer" id="history-footer" style="display:none">
    <button class="btn btn-ghost btn-full" onclick="clearAllSnapshots()">Limpar histórico</button>
  </div>
</div>

<div class="statusbar">
  <div class="status-left">
    <span id="status-text">Pronto</span>
    <span class="status-sep">·</span>
    <span id="char-count" class="status-muted">0 chars</span>
  </div>
  <div class="status-right">
    <span id="cursor-pos" class="status-cursor">1:1</span>
    <span class="status-sep">·</span>
    <span id="snap-count" class="status-muted">0 snapshots</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── Config ───────────────────────────────────────────────────────────────────
const CFG = {
  updateDelay: 350,
  statusResetDelay: 2500,
  toastDuration: 2200,
  maxSnapshots: 20,
  maxShareUrlLen: 8000,
};

const STORAGE_KEY = {
  snapshots: 'csslab_snapshots',
  session: 'csslab_session',
};

// ── State ────────────────────────────────────────────────────────────────────
let activeTab = 'html';
let updateTimer = null;
let statusTimer = null;
let toastTimer = null;
let snapshots = [];
let cmHTML, cmCSS;

// ── Templates ────────────────────────────────────────────────────────────────
const TEMPLATES = {
  blank: {
    html: `<div class="flex items-center justify-center min-h-screen bg-gray-50">\n  <h1 class="text-4xl font-bold text-gray-800">Olá, mundo!</h1>\n</div>`,
    css: ``
  },
  hero: {

// ── Editor setup ─────────────────────────────────────────────────────────────
function initEditors() {
  const shared = {
    theme: 'material-darker',
    lineNumbers: true,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
  };

  cmHTML = CodeMirror.fromTextArea(document.getElementById('editor-html'), {
    ...shared, mode: 'htmlmixed', autoCloseTags: true,
  });
  cmCSS = CodeMirror.fromTextArea(document.getElementById('editor-css'), {
    ...shared, mode: 'css',
  });

  cmHTML.on('change', onEditorChange);
  cmCSS.on('change', onEditorChange);
  cmHTML.on('cursorActivity', updateCursorPos);
  cmCSS.on('cursorActivity', updateCursorPos);
}

function activeEditor() {
  return activeTab === 'html' ? cmHTML : cmCSS;
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initEditors();
  loadSnapshotsFromStorage();

  if (!loadFromURL() && !restoreSession()) {
    loadTemplate('hero');
  }

  renderHistory();
  updateTabCounts();
  updateCharCount();
  updateCursorPos();
  bindKeyboard();
});

function loadSnapshotsFromStorage() {
  try { snapshots = JSON.parse(localStorage.getItem(STORAGE_KEY.snapshots) || '[]'); }
  catch (e) { snapshots = []; }
}

// ── Tab management ────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  activeEditor().refresh();
  updateCursorPos();
}

function updateTabCounts() {
  const h = cmHTML.lineCount();
  const c = cmCSS.lineCount();
  document.getElementById('count-html').textContent = h > 1 ? ` · ${h}L` : '';
  document.getElementById('count-css').textContent = c > 1 ? ` · ${c}L` : '';
}

// ── Dropdown ──────────────────────────────────────────────────────────────────
function toggleDropdown(id) {
  document.getElementById(id).classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown-wrap')) {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
  }
});

// ── Templates ─────────────────────────────────────────────────────────────────
function loadTemplate(name) {
  const t = TEMPLATES[name];
  if (!t) return;
  cmHTML.setValue(t.html);
  cmCSS.setValue(t.css || '');
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
  updatePreview();
}

// ── Preview ───────────────────────────────────────────────────────────────────
function onEditorChange() {
  clearTimeout(updateTimer);
  updateTimer = setTimeout(() => {
    updatePreview();
    updateTabCounts();
    updateCharCount();
    saveSession();
  }, CFG.updateDelay);
}

function updatePreview() {
  const html = cmHTML.getValue();
  const css = cmCSS.getValue();
  const doc = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"><\/script>${css ? `\n<style>${css}<\/style>` : ''}
</head>
<body>${html}<\/body>
</html>`;
  document.getElementById('preview').srcdoc = doc;
  setStatus('Preview atualizado');
}

// ── Viewport ──────────────────────────────────────────────────────────────────
function setViewport(mode, btn) {
  document.querySelectorAll('[id^="vp-"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const wrap = document.getElementById('preview-wrap');
  wrap.className = 'preview-wrap' + (mode !== 'desktop' ? ' ' + mode : '');
}

// ── Copy / Export / Share ─────────────────────────────────────────────────────
function copyCode() {
  navigator.clipboard.writeText(activeEditor().getValue())
    .then(() => toast('Código copiado'));
}

function exportHTML() {
  const css = cmCSS.getValue();
  const body = cmHTML.getValue();
  const full = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"><\/script>${css ? `\n<style>\n${css}\n<\/style>` : ''}
</head>
<body>
${body}
<\/body>
</html>`;
  const ts = new Date().toISOString().slice(0, 10);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([full], { type: 'text/html' })),
    download: `csslab-${ts}.html`,
  });
  a.click();
  toast('Arquivo exportado');
}

function shareURL() {
  try {
    const encoded = btoa(unescape(encodeURIComponent(
      JSON.stringify({ h: cmHTML.getValue(), c: cmCSS.getValue() })
    )));
    const url = location.origin + location.pathname + '?code=' + encoded;
    if (url.length > CFG.maxShareUrlLen) { toast('Código muito grande para compartilhar'); return; }
    navigator.clipboard.writeText(url).then(() => toast('URL copiada'));
  } catch (e) {
    toast('Erro ao gerar URL');
  }
}

function loadFromURL() {
  try {
    const code = new URLSearchParams(location.search).get('code');
    if (!code) return false;
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    cmHTML.setValue(data.h || '');
    cmCSS.setValue(data.c || '');
    updatePreview();
    toast('Código carregado via URL');
    return true;
  } catch (e) {
    return false;
  }
}

// ── Snapshots ─────────────────────────────────────────────────────────────────
function saveSnapshot() {
  const snap = {
    id: Date.now(),
    time: new Date().toLocaleString('pt-BR'),
    html: cmHTML.getValue(),
    css: cmCSS.getValue(),
    preview: cmHTML.getValue().replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 60),
  };
  snapshots.unshift(snap);
  if (snapshots.length > CFG.maxSnapshots) snapshots.length = CFG.maxSnapshots;
  persistSnapshots();
  renderHistory();
  toast('Snapshot salvo');
}

function deleteSnapshot(id, e) {
  e.stopPropagation();
  snapshots = snapshots.filter(s => s.id !== id);
  persistSnapshots();
  renderHistory();
  toast('Snapshot removido');
}

function clearAllSnapshots() {
  snapshots = [];
  persistSnapshots();
  renderHistory();
  toast('Histórico limpo');
}

function restoreSnapshot(id) {
  const s = snapshots.find(x => x.id === id);
  if (!s) return;
  cmHTML.setValue(s.html);
  cmCSS.setValue(s.css || '');
  updatePreview();
  updateTabCounts();
  closeHistory();
  toast('Versão restaurada');
}

function renderHistory() {
  const count = snapshots.length;
  document.getElementById('snap-count').textContent = count + ' snapshot' + (count !== 1 ? 's' : '');
  document.getElementById('history-footer').style.display = count ? '' : 'none';

  const list = document.getElementById('history-list');
  if (!count) {
    list.innerHTML = `<div class="history-empty">Nenhum snapshot ainda.<br/>Use <kbd>Ctrl+S</kbd> para salvar.</div>`;
    return;
  }
  list.innerHTML = snapshots.map((s, i) => `
    <div class="history-item${i === 0 ? ' current' : ''}" onclick="restoreSnapshot(${s.id})">
      <div class="history-item-top">
        <span class="history-time">${s.time}${i === 0 ? ' · atual' : ''}</span>
        <span class="history-del" onclick="deleteSnapshot(${s.id}, event)" title="Remover">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </span>
      </div>
      <div class="history-preview">${s.preview || 'Sem conteúdo'}…</div>
    </div>`).join('');
}

function toggleHistory() { document.getElementById('history-panel').classList.toggle('open'); }
function closeHistory() { document.getElementById('history-panel').classList.remove('open'); }

// ── Session ───────────────────────────────────────────────────────────────────
function saveSession() {
  try {
    localStorage.setItem(STORAGE_KEY.session, JSON.stringify({ h: cmHTML.getValue(), c: cmCSS.getValue() }));
  } catch (e) {}
}

function restoreSession() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY.session) || 'null');
    if (!data || !data.h) return false;
    cmHTML.setValue(data.h);
    cmCSS.setValue(data.c || '');
    updatePreview();
    return true;
  } catch (e) {
    return false;
  }
}

function persistSnapshots() {
  try { localStorage.setItem(STORAGE_KEY.snapshots, JSON.stringify(snapshots)); } catch (e) {}
}

// ── Status / Toast ────────────────────────────────────────────────────────────
function setStatus(msg) {
  const el = document.getElementById('status-text');
  if (el) el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { if (el) el.textContent = 'Pronto'; }, CFG.statusResetDelay);
}

function updateCharCount() {
  const total = cmHTML.getValue().length + cmCSS.getValue().length;
  document.getElementById('char-count').textContent = total.toLocaleString('pt-BR') + ' chars';
}

function updateCursorPos() {
  const cur = activeEditor().getCursor();
  document.getElementById('cursor-pos').textContent = `${cur.line + 1}:${cur.ch + 1}`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), CFG.toastDuration);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
function bindKeyboard() {
  document.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;

    if (ctrl && !e.shiftKey && e.key === 's')     { e.preventDefault(); saveSnapshot(); }
    if (ctrl && e.key === 'Enter')                { e.preventDefault(); updatePreview(); }
    if (ctrl && e.shiftKey && e.key === 'C')      { e.preventDefault(); copyCode(); }
    if (ctrl && e.shiftKey && e.key === 'E')      { e.preventDefault(); exportHTML(); }
    if (ctrl && e.key === '1')                    { e.preventDefault(); switchTab('html'); }
    if (ctrl && e.key === '2')                    { e.preventDefault(); switchTab('css'); }
    if (e.key === 'Escape') {
      closeHistory();
      document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
    }
  });
}
</script>
